<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Create with intention. Ship with care." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sdFootBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="sdFootLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#sdFootBg)"/>
  <rect x="200" y="30" width="800" height="1.5" fill="url(#sdFootLine)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#E5B5C7" font-style="italic">Create with intention. Ship with care.</text>
</svg>
