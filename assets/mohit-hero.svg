<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="sdHeroTitle sdHeroDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="sdHeroTitle">Mohit Pawan Dadhich</title>
  <desc id="sdHeroDesc">AI/ML and Data Science, Full-Stack Developer, Research Lead</desc>
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="sdGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sdLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sdPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="sdGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="sdBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sdBg)"/>
  <rect width="1200" height="420" fill="url(#sdGrid)"/>

  <!-- moving light -->
  <circle cx="900" cy="140" r="260" fill="url(#sdGlow)">
    <animate attributeName="cx" values="820;980;820" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;200;120" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- restrained orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
    <g transform="translate(960 210)">
      <ellipse rx="170" ry="60">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="170" ry="60" transform="rotate(60)">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="55s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="110" stroke-dasharray="2 8"/>
      <circle r="5" cx="110" fill="#E5B5C7" stroke="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- drawn path -->
  <path d="M60 340 C 260 250, 380 390, 560 300 S 840 250, 1140 330" fill="none" stroke="url(#sdPath)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1400;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="70" y="170" font-size="62" fill="#F8F0F3" font-weight="600" letter-spacing="1">Mohit Pawan Dadhich</text>
    <text x="72" y="215" font-size="22" fill="#E5B5C7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.5">AI/ML &amp; Data Science  |  Full-Stack Developer  |  Research Lead</text>
  </g>

  <!-- glowing underline -->
  <g>
    <rect x="70" y="236" width="520" height="4" rx="2" fill="url(#sdLine)" filter="url(#sdBlur)" opacity="0.8"/>
    <rect x="70" y="236" width="520" height="2" rx="1" fill="url(#sdLine)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
