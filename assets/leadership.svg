<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="Leadership timeline at CSI RAIT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="sdLb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#2E0E1D"/></linearGradient>
<linearGradient id="sdLl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0.2"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="388" rx="16" fill="url(#sdLb)" stroke="#C77B9B" stroke-opacity="0.3"/>
<text x="36" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F8F0F3">Computer Society of India (CSI RAIT)</text>
<text x="1164" y="48" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C77B9B">Aug 2024 – present</text>
<line x1="36" y1="68" x2="1164" y2="68" stroke="#C77B9B" stroke-opacity="0.2"/>
<rect x="299" y="120" width="2" height="205" fill="url(#sdLl)"/><text x="270" y="125" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C77B9B">Jul 2026 – Present</text><circle cx="300" cy="120" r="8" fill="#10070C" stroke="#E5B5C7" stroke-width="2"/><circle cx="300" cy="120" r="8" fill="none" stroke="#E5B5C7"><animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/></circle><circle cx="300" cy="120" r="3.5" fill="#E5B5C7"/><text x="335" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F8F0F3">Chief of Research and Development</text><text x="335" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.8">Coordinating student and faculty teams on research initiatives</text><text x="335" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.8">and mentoring peers on problem-solving and documentation.</text><text x="270" y="230" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C77B9B">Aug 2025 – Jul 2026</text><circle cx="300" cy="225" r="8" fill="#10070C" stroke="#E5B5C7" stroke-width="2"/><text x="335" y="231" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F8F0F3">Research Head</text><text x="335" y="255" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.8">Coordinated student and faculty teams on research activities,</text><text x="335" y="275" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.8">tracked milestones and reported progress.</text><text x="270" y="330" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#C77B9B">Aug 2024 – Jun 2025</text><circle cx="300" cy="325" r="8" fill="#10070C" stroke="#E5B5C7" stroke-width="2"/><text x="335" y="331" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F8F0F3">Technical Team Member and Debugging Expert</text><text x="335" y="355" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.8">Supported 3+ technical events and resolved 15+ software issues.</text></svg>